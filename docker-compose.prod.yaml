services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sovereign
      POSTGRES_PASSWORD: sovereign123
      POSTGRES_DB: sovereign_firm
    networks:
      - sovereign-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sovereign -d sovereign_firm"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=sovereign
      - POSTGRES_PWD=sovereign123
      - POSTGRES_SEEDS=postgres
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sovereign-net
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    networks:
      - sovereign-net
    depends_on:
      - temporal

  chroma:
    image: chromadb/chroma:0.5.5
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - sovereign-net

  # --- Application Services ---

  orchestrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["/app/orchestrator"]
    environment:
      - DATABASE_URL=postgres://sovereign:sovereign123@postgres:5432/sovereign_firm?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - CHROMA_URL=http://chroma:8000
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-ada-002}
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      chroma:
        condition: service_started
    networks:
      - sovereign-net

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command: ["/app/worker"]
    environment:
      - DATABASE_URL=postgres://sovereign:sovereign123@postgres:5432/sovereign_firm?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - CHROMA_URL=http://chroma:8000
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-ada-002}
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - sovereign-net

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      - API_URL=http://orchestrator:8080
    ports:
      - "3000:3000"
    restart: on-failure
    networks:
      - sovereign-net
    depends_on:
      - orchestrator

networks:
  sovereign-net:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
