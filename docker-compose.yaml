services:
  # 1. PostgreSQL (For Temporal)
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=sovereign
      - POSTGRES_PASSWORD=sovereign123
      - POSTGRES_DB=sovereign_firm
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sovereign-net

  # 2. Temporal Server
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=sovereign
      - POSTGRES_PWD=sovereign123
      - POSTGRES_SEEDS=postgres
    ports:
      - 7233:7233
    depends_on:
      - postgres
    networks:
      - sovereign-net

  # 3. Temporal UI
  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - 8088:8080
    depends_on:
      - temporal
    networks:
      - sovereign-net

  # 4. ChromaDB (Vector Store)
  chroma:
    image: chromadb/chroma:0.5.5
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=False
    ports:
      - 8000:8000
    volumes:
      - ./chroma-data:/chroma/chroma
    networks:
      - sovereign-net

  # 5. Backend (Go Orchestrator + Worker)
  # ISS-027: Azure API key now loaded from Docker secret file instead of environment variable
  # This prevents the key from being visible in container inspection or process listing.
  # Create secrets/azure_openai_api_key.txt with your API key before running.
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      - TEMPORAL_HOST=temporal:7233
      - CHROMA_HOST=chroma:8000
      - DATABASE_URL=postgres://sovereign:sovereign123@postgres:5432/sovereign_firm?sslmode=disable
      - LLM_PROVIDER=azure
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      # ISS-027: API key loaded from secret file, not environment variable
      - AZURE_OPENAI_API_KEY_FILE=/run/secrets/azure_openai_api_key
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-4}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-15-preview}
      - JWT_PRIVATE_KEY_PATH=/app/keys/jwt_rs256.key
      - JWT_PUBLIC_KEY_PATH=/app/keys/jwt_rs256.key.pub
    secrets:
      - azure_openai_api_key
    volumes:
      - ./jwt_rs256.key:/app/keys/jwt_rs256.key:ro
      - ./jwt_rs256.key.pub:/app/keys/jwt_rs256.key.pub:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8080:8080
    depends_on:
      - temporal
      - chroma
      - postgres
    networks:
      - sovereign-net

  # 6. Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    environment:
      - ORCHESTRATOR_URL=http://backend:8080
    ports:
      - 3000:3000
    depends_on:
      - backend
    networks:
      - sovereign-net

networks:
  sovereign-net:
    driver: bridge

volumes:
  postgres-data:

# ISS-027: Docker secrets for sensitive credentials
# Create a 'secrets' directory and add your API key:
#   mkdir -p secrets
#   echo "your-api-key-here" > secrets/azure_openai_api_key.txt
secrets:
  azure_openai_api_key:
    file: ./secrets/azure_openai_api_key.txt
